---
layout: default
---

<h1>The Fish n Fly Atlas</h1>

<div id="atlas-stats"></div>

<div id="atlas-legend"></div>

<button id="random-journey">Follow a Thread</button>

<div id="map" style="height:600px;"></div>

<div id="country-card">
  <h2>Select a Destination</h2>
  <p>Click a marker on the map.</p>
</div>

<style>
  #atlas-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.75rem;
    margin: 1rem 0;
  }

  .stat-box {
    background: #f7f7f7;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 0.75rem;
    text-align: center;
  }

  .stat-number {
    font-size: 1.5rem;
    font-weight: 700;
    color: #222;
  }

  .stat-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666;
  }

  #atlas-legend {
    margin: 1rem 0;
    padding: 0.75rem 1rem;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    background: #fafafa;
  }

  #atlas-legend h3 {
    margin: 0 0 0.75rem;
    font-size: 1rem;
  }

  .legend-items {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    color: #333;
  }

  .legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    border: 1px solid rgba(0,0,0,0.2);
    display: inline-block;
  }

</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="/assets/js/atlas.js"></script>
