---
layout: default
---

<h1>The Fish n Fly Atlas</h1>

<div id="atlas-stats"></div>

<div id="atlas-legend"></div>

<button id="random-journey">Follow a Thread</button>

<div id="map" style="height:600px;"></div>

<div id="country-card">
  <h2>Select a Destination</h2>
  <p>Click a marker on the map.</p>
</div>

<style>
  #atlas-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.75rem;
    margin: 1rem 0;
  }

  .stat-box {
    background: #f7f7f7;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 0.75rem;
    text-align: center;
  }

  .stat-number {
    font-size: 1.5rem;
    font-weight: 700;
    color: #222;
  }

  .stat-label {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #666;
  }

 #atlas-legend {
  display: flex;
  flex-wrap: wrap;
  align-items: center;

  margin: 1rem 0;
  padding: 1rem 1.25rem;

  border: 1px solid #e0e0e0;
  border-radius: 10px;
  background: #fafafa;

  row-gap: 14px;
  column-gap: 22px;
}

.legend-item {
  display: inline-flex;
  align-items: center;

  gap: 8px;

  font-size: 0.95rem;
  color: #333;

  white-space: nowrap;
}

.legend-items {
  display: flex;
  flex-wrap: wrap;
  row-gap: 16px;
  column-gap: 30px;
}

.legend-swatch {
  width: 14px;
  height: 14px;

  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.2);

  flex-shrink: 0;
}

.legend-filter {
  cursor: pointer;
  transition: all 0.2s ease;
}

.legend-filter:hover {
  opacity: 0.8;
}

.legend-filter.active {
  background: #2c3e50;
  color: #fff;
  border-radius: 16px;
  padding: 4px 10px;
}

.atlas-read-link {
  display: inline-block;
  margin-top: 0.35rem;
  padding: 0.55rem 1rem;
  border: 1px solid rgba(27, 54, 65, 0.18);
  border-radius: 999px;
  background: linear-gradient(180deg, #f4f7f8 0%, #edf3f5 100%);
  color: #1f2a37;
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 2px 8px rgba(20, 34, 44, 0.06);
  transition: all 0.2s ease;
}

.atlas-read-link:hover,
.atlas-read-link:focus {
  background: linear-gradient(180deg, #edf3f5 0%, #e4edf1 100%);
  box-shadow: 0 1px 0 rgba(255,255,255,0.8) inset, 0 3px 10px rgba(20, 34, 44, 0.10);
  text-decoration: none;
}

</style>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="/assets/js/atlas.js"></script>
